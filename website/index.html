    <div class="r-story">
     <div class="r-feature-copy"><span class="r-kicker">今天 · 时间轴</span><h3>今天做什么，<br>一眼就有数。</h3><p>上课、做任务、留给自己的时间，放在同一条时间线上。先看今天，再拉远看看这一周。</p><p>截止日期提醒你什么时候交，执行时间告诉你什么时候做。两件事，各自清楚。</p><div class="r-story-notes"><span>日 / 三日 / 周视图</span><span>拖动调整时间</span><span>课程与日程一起看</span></div></div>
     <div class="r-example r-day-demo"><div class="r-demo-top"><b>今天</b><span>周三 · 示例安排</span></div><div class="r-mini-time"><span>09:00</span><div class="r-mini-block">整理报告资料<small>专心做一件事 · 90 分钟</small></div></div><div class="r-mini-time"><span>11:00</span><div class="r-free-time">留一点空闲，给临时的想法。</div></div><div class="r-mini-time"><span>14:30</span><div class="r-mini-block course">写作课<small>示例教学楼 302</small></div></div><div class="r-mini-time"><span>19:30</span><div class="r-mini-block">高数复习<small>从今天的错题开始</small></div></div></div>

     <div class="r-example r-list-demo"><div class="r-demo-top"><b>学习清单</b><span>点击勾选试试</span></div><div class="r-task"><label><input type="checkbox"><span>整理报告资料</span></label><small>明天截止</small></div><div class="r-task"><label><input type="checkbox"><span>复习高数</span></label><small>待安排</small></div><div class="r-task"><label><input type="checkbox" checked><span>提交英语作业</span></label><small>已完成</small></div><div class="r-ddl-strip"><span>接下来要交的</span><div class="r-deadline"><b>明天</b><div>课程报告<small>20:00 截止</small></div></div><div class="r-deadline"><b>周五</b><div>项目说明<small>14:00 截止</small></div></div></div></div>

   <section class="r-section r-wrap r-faq"><div class="r-head"><h2>开始之前，你可能想知道</h2></div>
    <details><summary>需要下载才能使用吗？</summary><p>不需要。点击“使用网页版”就能在浏览器里打开；也可以下载 Android App，在手机上使用。</p></details>
    <details><summary>AI 会直接改动我的安排吗？</summary><p>先生成方案，你可以查看、继续调整。确认后，方案才会写入日程。</p></details>
    <details><summary>免费使用范围是什么？</summary><p>DDL Killer 是完全免费的软件。官方 AI 免费额度用于让新用户体验助手，判断是否适合自己。这些 AI 调用会增加我们的运营成本，免费额度可能随成本和运行情况调整，具体额度以应用内显示为准。</p><p>长期使用建议在 AI 计划助手设置中配置自己的 API Key（<a href="/website/api-key-help.html">获取与配置教程</a>），或通过 <a href="https://ddlkiller.com/mcp-help.html" target="_blank" rel="noopener">MCP 接入自己的智能体</a>。第三方模型或智能体服务的费用按对应服务商规则由你承担，DDL Killer 不收取任何软件使用费用。任何以 DDL Killer 官方名义收取软件使用费用的行为均非官方，请勿付款。</p></details>
    <details><summary>我的学校能导入课表吗？</summary><p>不同学校的导入方式不同。请在<a href="https://ddlkiller.com/kebiao-help.html" target="_blank" rel="noopener">课表导入教程</a>中查看支持学校和对应步骤。</p></details>
    <details><summary>没有网络时还能使用吗？</summary><p>可以查看已缓存的数据、记录修改，联网后再同步。首次登录、发送验证码和 AI 生成方案等功能需要网络。</p></details>
   </section>
