org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Kotlin incremental compilation is not Windows cross-drive safe. Plugin sources live in
# C:\Users\<用户名>\AppData\Local\Pub\Cache\... while this project's Kotlin caches live on D:\...
# File.toRelativeString then fails with "this and base files have different roots", which
# surfaces as "Could not close incremental caches" and fails :<plugin>:compileReleaseKotlin.
# Proper fix: keep the pub cache on the same drive as the project. Turning incremental
# compilation off is the cheaper equivalent workaround.
kotlin.incremental=false